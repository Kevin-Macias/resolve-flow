[project]
name = "api"
version = "0.1.0"
description = "Resolve Flow API"
readme = "README.md"
authors = [
    { name = "Kevin Macias", email = "kevin.macias.a@gmai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.116.1",
    "psycopg[binary]>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
