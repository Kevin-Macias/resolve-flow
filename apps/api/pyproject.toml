[project]
name = "api"
version = "0.1.0"
description = "Resolve Flow API"
readme = "README.md"
authors = [
    { name = "Kevin Macias", email = "kevin.macias.a@gmai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.116.1",
    "psycopg[binary]>=3.2.9",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--cov=api --cov-branch --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["api"]

[tool.pyright]
include = ["src", "tests", "migrations", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "ASYNC", # Async programming mistakes
    "B",     # Common bugs and design problems
    "E4",    # Import formatting errors
    "E7",    # Statement errors
    "E9",    # Runtime and syntax errors
    "F",     # Undefined names and unused imports
    "I",     # Import sorting
    "UP",    # Modern Python syntax
]
